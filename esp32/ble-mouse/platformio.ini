; ESP32-WROOM-32 dev board (CP2102 USB-serial)
; Bluetooth LE mouse that jiggles the cursor so the paired computer never goes idle.
; Build:           python -m platformio run
; Build + flash:   python -m platformio run -t upload
; Serial monitor:  python -m platformio device monitor   (type "help")

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = esp32_exception_decoder, send_on_enter
upload_speed = 921600
board_build.partitions = huge_app.csv   ; the Bluetooth stack doesn't fit the default 1.2 MB app slot
