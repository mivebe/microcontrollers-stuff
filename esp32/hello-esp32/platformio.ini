; ESP32-WROOM-32 dev board (CP2102 USB-serial)
; Build:           pio run
; Build + flash:   pio run -t upload
; Serial monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
