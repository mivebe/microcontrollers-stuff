; ESP32-WROOM-32 dev board (CP2102 USB-serial)
; Build + flash firmware:  pio run -t upload        (VS Code: Upload)
; Flash the web UI:        pio run -t uploadfs      (VS Code: Upload Filesystem Image)
; Serial monitor:          pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; Web UI lives in data/ (built from the React app in web/) on a LittleFS partition
board_build.filesystem = littlefs
extra_scripts = pre:build_web.py
