; ESP32-WROOM-32 dev board (CP2102 USB-serial)
; LED controlled from anywhere via HiveMQ Cloud (MQTT over TLS).
; Copy include/secrets.example.h -> include/secrets.h and fill it in before the first USB upload.
; Firmware version lives in include/version.h (bump it to publish an OTA update).

[env:esp32dev]
platform = espressif32@7.1.3   ; pinned so CI builds match local ones
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
