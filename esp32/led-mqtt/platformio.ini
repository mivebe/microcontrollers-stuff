; ESP32-WROOM-32 dev board (CP2102 USB-serial)
; LED controlled from anywhere via HiveMQ Cloud (MQTT over TLS).
; Copy include/secrets.example.h -> include/secrets.h and fill it in before building.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  knolleary/PubSubClient@^2.8
