# Builds the ESP32 LED remote-control web app (esp32/led-mqtt/web) and publishes it to GitHub Pages:
# https://mivebe.github.io/microcontrollers-stuff/
name: Deploy LED web app to Pages

on:
  push:
    branches: [master]
    paths:
      - esp32/led-mqtt/web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32/led-mqtt/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: esp32/led-mqtt/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: esp32/led-mqtt/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
